[project]
name = "gri-backend"
version = "0.1.0"
description = "GRI API — multi-restaurante gestion y reservas"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.0",
    "uvicorn[standard]>=0.52.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncmy>=0.2.14",
    "pydantic-settings>=2.0",
    # cryptography: required by asyncmy/PyMySQL to complete the
    # caching_sha2_password handshake (MySQL 8.4 default auth plugin) over
    # non-TLS connections (e.g. the internal docker network). Has manylinux +
    # win wheels, so no build toolchain needed.
    "cryptography>=43.0",
    # --- Phase 2: auth + tenancy ---
    # PyJWT 2.13 (NOT python-jose — dormant). HS256 JWT encode/decode.
    "pyjwt>=2.13.0",
    # bcrypt direct (NOT passlib — frozen since 2020-10-08, abandoned).
    # 4.x Rust core, manylinux + win wheels.
    "bcrypt>=4.0",
    # Alembic: schema migrations (pulled forward from Phase 3 — first permanent
    # models land here). Same author as SQLAlchemy.
    "alembic>=1.19.0",
    # email-validator: backs pydantic.EmailStr on UserCreate/UserLogin.
    "email-validator>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "T20"]
ignore = ["S101"]  # allow assert in tests

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
