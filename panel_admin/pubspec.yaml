name: gri_panel_admin
description: "GRI Panel Admin (Flutter Web) — gestión y reservas multi-restaurante."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # State + DI (stack LOCKED del research Phase 4; ver SUMMARY — el codegen
  # de riverpod 3.4.x aún no tiene pairing publicado, se resuelve el máximo
  # set coherente)
  flutter_riverpod: '>=3.0.0 <4.0.0'
  riverpod_annotation: '>=3.0.0 <5.0.0'

  # HTTP + routing + storage + config
  dio: ^5.11.0
  go_router: ^17.5.0
  flutter_secure_storage: ^11.0.0
  flutter_dotenv: ^5.2.1
  intl: ^0.19.0

  # WS en vivo del panel (07-02): WebSocketChannel.connect cross-platform.
  web_socket_channel: ^3.0.3

  # Modelos inmutables + JSON
  freezed_annotation: '>=3.0.0 <4.0.0'
  json_annotation: ^4.12.0
  qr_flutter: 4.1.0
  data_table_2: 2.8.0
  web: 1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Fakes de WebSocketChannel en tests (07-02): StreamChannelMixin da las
  # ops derivadas; el fake solo implementa stream/sink/ready/closeCode.
  stream_channel: ^2.1.0

  build_runner: '>=2.4.0 <5.0.0'
  riverpod_generator: '>=3.0.0 <5.0.0'
  # Pineo exacto (mismo pin que app_cliente): freezed 3.2.6-dev.1 genera
  # `required final List<T>` inválido para campos List (bug del dev line);
  # 4.0.0-dev.3 genera el codegen correcto.
  freezed: '4.0.0-dev.3'
  json_serializable: '>=6.8.0 <7.0.0'

flutter:
  uses-material-design: true

  assets:
    - assets/.env
