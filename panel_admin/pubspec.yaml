name: gri_panel_admin
description: "GRI Panel Admin (Flutter Web) — gestión y reservas multi-restaurante."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # State + DI (stack LOCKED del research Phase 4; ver SUMMARY — el codegen
  # de riverpod 3.4.x aún no tiene pairing publicado, se resuelve el máximo
  # set coherente)
  flutter_riverpod: '>=3.0.0 <4.0.0'
  riverpod_annotation: '>=3.0.0 <5.0.0'

  # Routing + formatos
  go_router: ^17.5.0
  intl: ^0.19.0

  # Firebase (Phase 10, Opción B — pins LOCKED idénticos a app_cliente):
  # Firestore es la única fuente de verdad; Auth por claims {role, rid}.
  firebase_core: 4.13.0
  firebase_auth: 6.5.7
  cloud_firestore: 6.8.0

  # Modelos inmutables + JSON
  freezed_annotation: '>=3.0.0 <4.0.0'
  json_annotation: ^4.12.0
  qr_flutter: 4.1.0
  data_table_2: 2.8.0
  web: 1.1.1
  cloud_functions: 6.3.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  # fake_async: para probar el LATIDO del reloj de sala (11-34) sin esperar 30
  # segundos por tic. Llegaba transitivamente por flutter_test, pero
  # `depend_on_referenced_packages` exige declararlo — y con razón: un test
  # que depende de una transitiva se rompe cuando la cadena cambia.
  fake_async: ^1.3.1

  flutter_lints: ^6.0.0

  # Fakes de Firebase en tests (Phase 10): Firestore in-memory + Auth mock
  # (los emuladores NO funcionan en `flutter test` — sin platform channels).
  fake_cloud_firestore: 4.2.0
  firebase_auth_mocks: 0.15.2
  # Dep directa: simular FirebaseAuthException con `whenCalling` dispara
  # depend_on_referenced_packages si se importa como transitiva (lección
  # 10-02 app_cliente).
  mock_exceptions: ^0.8.2

  build_runner: '>=2.4.0 <5.0.0'
  riverpod_generator: '>=3.0.0 <5.0.0'
  # Pineo exacto (mismo pin que app_cliente): freezed 3.2.6-dev.1 genera
  # `required final List<T>` inválido para campos List (bug del dev line);
  # 4.0.0-dev.3 genera el codegen correcto.
  freezed: '4.0.0-dev.3'
  json_serializable: '>=6.8.0 <7.0.0'

flutter:
  uses-material-design: true
