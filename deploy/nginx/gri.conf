# =============================================================================
# GRI — nginx reverse proxy de PRODUCCIÓN (HOST Ubuntu 24.04, apt nginx 1.24).
#
# Instalación (ver deploy/README.md §7):
#   sudo cp deploy/nginx/gri.conf /etc/nginx/sites-available/gri
#   sudo ln -s /etc/nginx/sites-available/gri /etc/nginx/sites-enabled/gri
#   sudo nano /etc/nginx/sites-available/gri   # reemplazar gri.example.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# Este archivo vive en /etc/nginx/conf.d|sites-available → contexto HTTP,
# por eso el `map` de nivel http es válido aquí.
#
# Arquitectura (09-RESEARCH §Patrón 7): same-origin por paths. UN dominio,
# UN certificado: / y estáticos → panel Flutter Web; /ws/ + paths de la API
# → 127.0.0.1:8000 (el único cliente posible de la API es este nginx).
# CERO CORS para el panel (CORS_ORIGINS queda como defensa).
# =============================================================================

# Patrón OFICIAL nginx.org/en/docs/http/websocket.html: mapea el header
# Upgrade entrante al valor del header Connection saliente. '' close evita
# colar "Connection: upgrade" en requests HTTP normales del mismo location.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- HTTP :80 → redirección a HTTPS ------------------------------------------
# certbot --nginx (README §9) inserta AQUÍ su location /.well-known/acme-
# challenge antes de este redirect (lo hace solo al correr con --nginx);
# tras el primer certbot este server queda solo como redirect 301.
server {
    listen 80;
    # TODO-reemplazar: dominio REAL del deploy (README §1: DNS A → IP server)
    server_name gri.example.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS :443 — API + WS + panel -------------------------------------------
server {
    # http2 como PARÁMETRO de listen: la directiva standalone `http2 on;`
    # solo existe desde nginx 1.25.1 — Ubuntu 24.04 trae 1.24 (fallaría el
    # arranque). En nginx >= 1.25 este parámetro queda deprecated pero sigue
    # funcionando, así que es la forma portable para el target real.
    listen 443 ssl http2;
    # TODO-reemplazar: dominio REAL (debe coincidir con el server de arriba
    # y con el -d de certbot — las rutas de abajo las genera certbot).
    server_name gri.example.com;

    # Certificados Let's Encrypt (los crea certbot --nginx, README §9).
    # TODO-reemplazar gri.example.com por el dominio real en AMBAS rutas.
    ssl_certificate     /etc/letsencrypt/live/gri.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gri.example.com/privkey.pem;

    # --- WebSocket (/ws/staff, /ws/cliente) ----------------------------------
    # Los 3 headers + proxy_http_version son OBLIGATORIOS: nginx < 1.29.7
    # (Ubuntu 24.04 = 1.24) REQUIERE proxy_http_version 1.1 explícito para
    # el handshake WS — sin él el upgrade muere detrás del proxy.
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Default 60s CORTA conexiones WS idle (09-RESEARCH Pitfall 4):
        # 1h + el ping protocolar de uvicorn (20s) mantiene la conexión viva.
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
    }

    # --- API REST (routers FastAPI montados en RAÍZ — sin prefijo /api) ------
    # Prefijos reales de app/main.py: auth, public, cliente, staff, admin,
    # health, docs, openapi.json, redoc, webhooks (Wompi), pagos. El terminador
    # (/|$) evita matchear paths falsos tipo /healthfoo.
    location ~ ^/(auth|public|cliente|staff|admin|health|docs|openapi\.json|redoc|webhooks|pagos)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # la API sabe que sirvió TLS
        client_max_body_size 5m;                      # fotos de platos (uploads menú)
    }

    # --- Panel admin (estáticos Flutter Web) + SPA fallback ------------------
    # panel_admin/build/web se copia a /var/www/gri-panel (README §6).
    # try_files → index.html: cualquier ruta profunda del SPA sirve la app.
    location / {
        root /var/www/gri-panel;
        try_files $uri $uri/ /index.html;
        # Estáticos con hash en el nombre → cache agresivo (7 días).
        location ~* \.(js|json|png|jpg|svg|wasm|otf|ttf)$ {
            root /var/www/gri-panel;
            expires 7d;
            add_header Cache-Control "public";
        }
    }
}
