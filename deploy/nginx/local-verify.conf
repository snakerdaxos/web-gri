# =============================================================================
# GRI — variante de verificación LOCAL (SOLO para deploy/verify_local.ps1).
#
# ESTE ARCHIVO NO SE USA EN EL SERVIDOR REAL: allí corre el nginx del HOST
# (apt) con deploy/nginx/gri.conf (TLS + redirect + 127.0.0.1:8000). Aquí la
# verificación local levanta nginx:1.24 en CONTENEDOR conectado a la red del
# stack prod (gri-prod_default), por eso el proxy_pass usa el NOMBRE del
# contenedor (gri-prod-api) en vez de 127.0.0.1 — dentro de la red docker,
# 127.0.0.1 sería el propio contenedor nginx.
#
# Mismas locations/headers que gri.conf (los 3 headers WS + proxy_http_version
# 1.1 + proxy_read_timeout 3600s) para que lo que se valida localmente sea
# EXACTAMENTE lo que correrá en producción.
# =============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;   # sin ssl, sin redirect — verificación local only

    # --- WebSocket: idéntico a gri.conf (headers OBLIGATORIOS) ---
    location /ws/ {
        proxy_pass http://gri-prod-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
    }

    # --- API REST: mismos prefijos que gri.conf ---
    location ~ ^/(auth|public|cliente|staff|admin|health|docs|openapi\.json|redoc|webhooks|pagos)(/|$) {
        proxy_pass http://gri-prod-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5m;
    }

    # --- Panel estático: mismo try_files SPA; el volumen monta
    #     panel_admin/build/web en /usr/share/nginx/html (imagen nginx:1.24) ---
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        location ~* \.(js|json|png|jpg|svg|wasm|otf|ttf)$ {
            root /usr/share/nginx/html;
            expires 7d;
            add_header Cache-Control "public";
        }
    }
}
