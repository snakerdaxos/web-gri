name: gri_cliente
description: "GRI App Cliente (Flutter, web-first en Chrome) — descubrimiento y reservas."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # State + DI (stack LOCKED — idéntico a panel_admin 04-02)
  flutter_riverpod: '>=3.0.0 <4.0.0'
  riverpod_annotation: '>=3.0.0 <5.0.0'

  # Routing
  go_router: ^17.5.0
  intl: ^0.19.0

  # QR scanner (Phase 6 — MESA-05). Web OK en localhost:5174 (secure
  # context); el input manual GRI-MESA-XXX es vía de primera clase.
  mobile_scanner: ^7.4.0

  # Modelos inmutables + JSON
  freezed_annotation: '>=3.0.0 <4.0.0'
  json_annotation: ^4.12.0

  # Firebase (Phase 10 — Opción B: apps hablan directo a Firebase).
  # Pins EXACTOS del research (release train 2026-08-03 verificado pub.dev).
  firebase_core: 4.13.0
  firebase_auth: 6.5.7
  cloud_firestore: 6.8.0

  # Ingreso con Google del CLIENTE (11-17). Publisher verificado en la API de
  # pub.dev: flutter.dev (equipo oficial de Flutter). Pin EXACTO por la
  # mitigación T-11-17-SC: entra en el binario de producción.
  # ⚠️ La API cambió por completo en 7.x — no vale la de 6.x.
  # Solo lo usa la rama Android/iOS: en Web se usa
  # FirebaseAuth.signInWithPopup (ver lib/core/google_auth.dart).
  google_sign_in: 7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: '>=2.4.0 <5.0.0'
  riverpod_generator: '>=3.0.0 <5.0.0'
  # 3.2.6-dev.1 genera `required final List<T>` inválido en modelos con List.
  # Prerelease 4.0.0-dev.3 (único rango compatible con json_serializable
  # 6.14.1 / analyzer >=10) — verificar codegen de List fields.
  freezed: '4.0.0-dev.3'
  json_serializable: '>=6.8.0 <7.0.0'
  stream_channel: 2.1.4

  # Fakes Firebase para tests (Phase 10 — emuladores no funcionan en
  # `flutter test`; ver research "Alternatives Considered").
  fake_cloud_firestore: 4.2.0
  firebase_auth_mocks: 0.15.2
  # Helper de throws de los mocks (whenCalling) — transitive de
  # firebase_auth_mocks; directo para importarlo en tests sin lint.
  mock_exceptions: ^0.8.2

  # Generación de los assets de marca (tool/gen_branding.dart). Publisher
  # verificado en pub.dev: loki3d.com. Pin EXACTO por la mitigación T-11-18-SC.
  # Se fija 4.9.1 (2026-05-30) y NO la 4.9.2, publicada hace horas: una versión
  # recién salida no ha tenido tiempo de exposición. dev_dependency: no entra
  # en el binario de producción.
  image: 4.9.1

  # Icono de launcher y splash del movil. Publishers verificados en pub.dev:
  # fluttercommunity.dev y jonhanson.net. Pin EXACTO por T-11-18-SC.
  # Ambos estan recomendados en la documentacion de stack del proyecto desde el
  # principio y nunca se habian anadido: hasta 11-18 la app arrancaba con el
  # logo por defecto de Flutter y un splash en blanco.
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.8

flutter:
  uses-material-design: true

# ---------------------------------------------------------------------------
# Marca en el movil (11-18)
# ---------------------------------------------------------------------------
# Las fuentes de los dos generadores las produce `dart run tool/gen_branding.dart`
# — no hay ningun PNG aportado a mano. Regenerar los assets y volver a correr:
#   dart run tool/gen_branding.dart
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
flutter_launcher_icons:
  # web: NO. Los iconos de la PWA (Icon-192/512 y sus maskable) los genera
  # tool/gen_branding.dart con los nombres EXACTOS que declara el manifest.json;
  # dejar que este paquete los reescriba rompería esas rutas.
  web:
    generate: false
  ios: false
  android: true
  image_path: "assets/branding/icon_1024.png"
  min_sdk_android: 21
  # Adaptive icon: Android compone fondo + primer plano y les aplica su propia
  # máscara. El primer plano es el glifo SOLO, sobre transparente y al 62% del
  # lienzo, que es la zona segura de un adaptive icon (recorte 72/108).
  adaptive_icon_background: "#FF4C05"
  adaptive_icon_foreground: "assets/branding/icon_foreground_1024.png"
  # 0 y no el 16% por defecto: el asset YA viene con su zona segura aplicada
  # (glifo al 58% del lienzo). Con el inset por defecto se aplicaba dos veces y
  # el glifo quedaba diminuto dentro del naranja.
  adaptive_icon_foreground_inset: 0

flutter_native_splash:
  color: "#FF4C05"
  image: assets/branding/icon_512.png
  android: true
  ios: false
  web: false
  # Android 12+ dibuja el splash el SISTEMA y NO lee launch_background.xml:
  # necesita su propia clave o el arranque vuelve al blanco por defecto.
  android_12:
    color: "#FF4C05"
    image: assets/branding/icon_foreground_1024.png
    icon_background_color: "#FF4C05"
